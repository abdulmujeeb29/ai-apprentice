{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AI Apprentice{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' fill='%23f2a93b'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'apprentice/app.css' %}">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/SplitText.min.js"></script>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="/" aria-label="AI Apprentice home">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <defs><radialGradient id="bm" cx="38%" cy="34%" r="72%"><stop offset="0" stop-color="#ffe2b0"/><stop offset=".5" stop-color="#f2a93b"/><stop offset="1" stop-color="#6b3f0c"/></radialGradient></defs>
          <circle cx="12" cy="16" r="8" fill="url(#bm)"/>
          <path d="M22.5 10.5a8 8 0 0 1 0 11" fill="none" stroke="#f2a93b" stroke-width="1.8" stroke-linecap="round" opacity=".85"/>
          <path d="M26.5 7a13 13 0 0 1 0 18" fill="none" stroke="#f2a93b" stroke-width="1.8" stroke-linecap="round" opacity=".45"/>
        </svg>
        <span class="brand-name">AI <em>Apprentice</em></span>
        <span class="brand-sub">for Thales Ops</span>
      </a>
      <nav class="nav">{% block nav %}<a href="/">Work Maps</a><a href="https://elevenlabs.io" target="_blank" rel="noopener">Voice by ElevenLabs</a>{% endblock %}</nav>
    </header>
    {% block content %}{% endblock %}
  </div>
  <div class="toast-wrap" id="toasts" aria-live="polite"></div>
  {% block scripts %}{% endblock %}
</body>
</html>
