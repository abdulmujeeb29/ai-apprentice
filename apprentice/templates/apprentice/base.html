{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Sidecar · runs alongside your best engineer{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='12' cy='16' r='10' fill='%23f2a93b'/><circle cx='27' cy='16' r='4' fill='none' stroke='%23f2a93b' stroke-width='2'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'apprentice/app.css' %}">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/SplitText.min.js"></script>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="/" aria-label="Sidecar home">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <defs><radialGradient id="bm" cx="38%" cy="34%" r="72%"><stop offset="0" stop-color="#ffe2b0"/><stop offset=".5" stop-color="#f2a93b"/><stop offset="1" stop-color="#6b3f0c"/></radialGradient></defs>
          <circle cx="12.5" cy="16" r="9" fill="url(#bm)"/>
          <path d="M21.5 16h2" stroke="#f2a93b" stroke-width="1.6" stroke-linecap="round" opacity=".7"/>
          <circle cx="27" cy="16" r="3.6" fill="none" stroke="#f2a93b" stroke-width="1.6"/>
        </svg>
        <span class="brand-name">Side<em>car</em></span>
        <span class="brand-sub">AI apprentice for Thales Ops</span>
      </a>
      <nav class="nav">{% block nav %}<a href="/">Work Maps</a><a href="https://elevenlabs.io" target="_blank" rel="noopener">Voice by ElevenLabs</a>{% endblock %}</nav>
    </header>
    {% block content %}{% endblock %}
  </div>
  <div class="toast-wrap" id="toasts" aria-live="polite"></div>
  {% block scripts %}{% endblock %}
</body>
</html>
